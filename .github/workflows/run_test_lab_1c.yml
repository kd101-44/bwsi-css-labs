name: lab_1c unit tests

on:
  push:
    branches:
      - main
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️ Check out your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage

      # 4️ Run tests using pytest with coverage
      - name: Run tests
        run: |
          coverage run -m pytest
          coverage report -m